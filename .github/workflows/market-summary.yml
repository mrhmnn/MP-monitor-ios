name: Weekly Market Price Summary

# Posts the per-model price benchmark (pricebench.py --summary) to Telegram
# every Saturday, ahead of the 16:30 weekly review. Read-only: restores
# the database from the data branch but never writes back - the scan
# workflow owns all state changes.
#
# CORRECTION 2026-10-03 (audit): this used to ask for "0 14" = 16:00 NL,
# half an hour before the review. It never arrived then. Actual fire times
# of all 11 runs, UTC: 17:33 16:57 16:40 16:27 17:27 14:14 14:15 15:02
# 17:37 17:35 17:37 - only 2 of 11 near the intended time, and 8 of 11
# AFTER the review, up to 3.5 hours late (19:37 NL on his phone). GitHub's
# shared scheduler defers cron under load and the top of the hour is the
# most contended minute there is.
#
# "35 11" buys a ~4h cushion and sits off the hour, so even the worst
# observed delay still lands before 16:30. Arriving early costs nothing -
# this is a snapshot, not a live feed. GitHub cron has no timezone support,
# so one UTC slot has to cover both clocks: from 2026-10-25 (NL leaves
# summer time) it reads 12:35 NL instead of 13:35, still comfortably early.
on:
  schedule:
    - cron: "35 11 * * 6"   # Sat 11:35 UTC - deliberately early, see above
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "MP Agent"

    steps:
      - name: Check out repository (main branch, for code)
        uses: actions/checkout@v4

      - name: Restore database from data branch
        working-directory: ${{ github.workspace }}
        run: |
          if git ls-remote --exit-code --heads origin data; then
            git fetch origin data
            git checkout origin/data -- "MP Agent/seen_listings.db" 2>/dev/null || echo "No database on data branch yet"
          else
            echo "data branch does not exist yet - nothing to report"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "MP Agent/requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send price summary to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pricebench.py --summary --telegram
